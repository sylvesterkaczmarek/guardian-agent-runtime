[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-agent-runtime"
version = "0.3.1"
description = "Reference monitor and adversarial benchmark for securing privileged actions by agentic systems."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "cryptography>=50,<51",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
guardian-verify = "guardian_runtime.verifier.cli:main"
guardian-verify-manifest = "guardian_runtime.verifier.manifest_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]
ignore = ["E501", "UP037", "UP038"]

[tool.ruff.lint.per-file-ignores]
"tests/properties/test_hypothesis_properties.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = [
  "guardian_runtime.yamlutil",
  "guardian_runtime.policy.engine",
  "guardian_runtime.factory",
  "guardian_runtime.adversarial.hardening",
]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["guardian_runtime.evidence.log"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["guardian_runtime.adversarial.attacks"]
disable_error_code = ["assignment"]

[tool.setuptools.package-data]
"guardian_runtime.resources" = ["guardian/*.yaml", "capabilities/*.yaml", "benchmarks/*.yaml"]
