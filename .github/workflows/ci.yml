name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vulnerability-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock
          no-deps: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python -m ruff check src tests experiments scripts formal
      - run: python -m mypy src/guardian_runtime
      - run: python -m pytest
      - run: python formal/check_model.py
      - if: matrix.python-version == '3.12'
        name: Model-check TLA+ specification
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum --check --strict
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -deadlock -workers 1 -config formal/guardian.cfg formal/guardian.tla
      - run: python -m experiments.attack_suite
      - if: matrix.python-version == '3.12'
        run: |
          python -m experiments.run_reference_suite
          git diff --exit-code -- results
      - if: matrix.python-version == '3.12'
        name: Verify isolated installed distribution
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          python scripts/verify_distribution.py dist/*.whl dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - run: python -m pip install --no-deps -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: make check
      - run: python scripts/showcase.py
