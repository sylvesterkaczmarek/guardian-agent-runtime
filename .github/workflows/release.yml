name: Release

on:
  push:
    branches:
      - "release/v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact release commit
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.version.outputs.distribution }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - name: Validate reviewed release ref
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python -c 'import re,sys; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",sys.argv[1])' "$VERSION"
          DISTRIBUTION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')"
          test "$DISTRIBUTION" = "guardian-runtime-assurance"
          test "$GITHUB_REF_NAME" = "release/v${VERSION}"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace it.' >&2
            exit 1
          fi
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and test exact distributions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-deps -r requirements.lock
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          mkdir -p proof
          python scripts/verify_distribution.py dist/*.whl dist/*.tar.gz --report proof/distribution.json
          python -m venv /tmp/guardian-metadata-check
          /tmp/guardian-metadata-check/bin/python -m pip install 'twine>=6,<7'
          /tmp/guardian-metadata-check/bin/python -m twine check --strict dist/*
          git archive --format=zip --output=proof/guardian-source.zip HEAD
          sha256sum dist/* proof/guardian-source.zip > proof/SHA256SUMS.txt
          VERSION="${{ steps.version.outputs.version }}"
          cp "docs/release-${VERSION}.md" proof/RELEASE_NOTES.md
          printf '%s\n' "$GITHUB_SHA" > proof/COMMIT.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-proof
          path: proof/*
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: Publish verified GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-proof
          path: proof
      - name: Create immutable-version release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* proof/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Guardian Agent Runtime $RELEASE_TAG" \
            --notes-file proof/RELEASE_NOTES.md --latest

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guardian-runtime-assurance/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify-pypi:
    name: Verify published PyPI distributions
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: expected-dist
      - name: Download public files and compare published hashes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DISTRIBUTION: ${{ needs.build.outputs.distribution }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request
          from pathlib import Path
          version=os.environ['VERSION'];distribution=os.environ['DISTRIBUTION']
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(f'https://pypi.org/pypi/{distribution}/{version}/json',timeout=30) as response:
                      metadata=json.load(response)
                  break
              except Exception:
                  if attempt==11:
                      raise
                  time.sleep(10)
          files={item['filename']:item for item in metadata['urls']}
          output=Path('public-dist');output.mkdir()
          for expected in Path('expected-dist').iterdir():
              item=files[expected.name]
              digest=hashlib.sha256(expected.read_bytes()).hexdigest()
              assert item['digests']['sha256']==digest, expected.name
              with urllib.request.urlopen(item['url'],timeout=30) as response:
                  data=response.read()
              assert hashlib.sha256(data).hexdigest()==digest, expected.name
              (output/expected.name).write_bytes(data)
          print('Public PyPI distribution hashes match the reviewed build.')
          PY
      - name: Test isolated public installation
        run: python scripts/verify_distribution.py public-dist/*.whl public-dist/*.tar.gz --report public-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-pypi-verification
          path: public-verification.json
          if-no-files-found: error
          retention-days: 90
